[project]
name = "rag"
version = "0.1.0"
description = "Hybrid search RAG with verified citations and abstention"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # ingestion
    "langchain-text-splitters>=0.2",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    # indexing / retrieval
    "openai>=1.40",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "torch>=2.2",  # listed directly so Linux (Docker) can take the CPU-only build below
    # generation
    "anthropic>=0.40",
    # api / dashboard
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

# On Linux the default torch wheel bundles CUDA (several GB). The reranker runs on
# CPU, so containers use PyTorch's CPU-only index. Windows/macOS wheels are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# langsmith (pulled in by langchain) auto-registers a pytest plugin we don't use
# Live tests cost money: plain `pytest` skips them; `pytest -m live` (a later -m wins) runs them.
addopts = "--strict-markers --import-mode=importlib -p no:langsmith_plugin -m \"not live\""
markers = [
    "unit: fast, no network, no API keys, fakes only",
    "integration: real ChromaDB/BM25 in a temp dir, fakes for paid APIs, no network",
    "live: calls real OpenAI (or Anthropic, if configured) APIs, run by hand",
]

[tool.coverage.run]
source = ["src/rag"]
branch = true
# Streamlit rendering only; its logic lives in dashboard/helpers.py, which is tested.
omit = ["src/rag/dashboard/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
